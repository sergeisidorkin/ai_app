server {
    listen 80;
    listen [::]:80;
    server_name dsh.imcmontanai.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dsh.imcmontanai.ru;

    ssl_certificate /etc/nginx/ssl-dsh/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl-dsh/privkey.pem;

    client_max_body_size 64m;

    # The DSH launch token is a bearer secret in the query string. Never write
    # it to the nginx access log. Django only reveals it through its protected
    # /dsh/ endpoint.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Origin https://$host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
