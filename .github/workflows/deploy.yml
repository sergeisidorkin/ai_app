name: Deploy

on:
  # Запускаем деплой ТОЛЬКО когда CI завершился на main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Ручной запуск
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref (branch, tag, or SHA) to deploy (optional for manual runs)'
        required: false
        default: 'main'

concurrency:
  # отдельная очередь на каждый SHA (для workflow_run) или ref (для ручного)
  group: deploy-${{ github.event.workflow_run.head_sha || github.event.inputs.ref || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy:
    # Разрешаем:
    #  - workflow_run: только если CI завершился success
    #  - workflow_dispatch: всегда
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    env:
      # Что деплоим:
      #  - при workflow_run: ровно тот commit, который прошёл CI (head_sha)
      #  - при ручном запуске: ref из inputs (или main)
      DEPLOY_REF: ${{ github.event.workflow_run.head_sha || github.event.inputs.ref || 'main' }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          envs: DEPLOY_REF
          script: |
            set -euo pipefail

            APP_DIR="$HOME/ai_appdir"
            REPO_DIR="$APP_DIR/ai_app"
            VENV_DIR="$APP_DIR/ai_appenv"
            VENV_ACT="$VENV_DIR/bin/activate"
            ENV_PATH_FILE="$APP_DIR/env/prod.env"
            REPO_SSH="git@github.com:sergeisidorkin/ai_app.git"

            github_git() {
              # Production hosts often block outbound TCP/22 to github.com.
              # Retry the same git command over GitHub's SSH-on-443 endpoint.
              local ssh_base='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12'
              if GIT_SSH_COMMAND="$ssh_base" git "$@"; then
                return 0
              fi
              echo "GitHub SSH on port 22 failed — retrying via ssh.github.com:443"
              GIT_SSH_COMMAND="$ssh_base -o HostName=ssh.github.com -p 443" git "$@"
            }

            echo "== Preflight =="
            mkdir -p "$APP_DIR" "$APP_DIR/env" "$APP_DIR/run"

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Cloning repo..."
              github_git clone "$REPO_SSH" "$REPO_DIR"
            fi

            if [ ! -d "$VENV_DIR" ]; then
              echo "Creating venv..."
              python3 -m venv "$VENV_DIR"
            fi

            test -f "$ENV_PATH_FILE" || { echo "prod.env not found: $ENV_PATH_FILE" >&2; exit 1; }

            echo "== Sync repo =="
            cd "$REPO_DIR"
            if ! git remote -v | grep -q "$REPO_SSH"; then
              git remote set-url origin "$REPO_SSH"
            fi

            github_git fetch --all --prune --tags

            REF="${DEPLOY_REF:-main}"
            echo "DEPLOY_REF=${REF}"

            git reset --hard
            git clean -fd

            # 1) Ветка на remote (origin/<ref>) — приоритет для имён вроде "main"
            if git rev-parse -q --verify "origin/$REF" >/dev/null; then
              git checkout -f -B "$REF" "origin/$REF"
              TARGET_DESC="origin/$REF"
            # 2) Тег
            elif git rev-parse -q --verify "refs/tags/$REF" >/dev/null; then
              git checkout -f "tags/$REF"
              TARGET_DESC="tag:$REF"
            # 3) Полный commit SHA (40 символов) — прямой чекаут
            elif echo "$REF" | grep -qE '^[0-9a-f]{40}$' && git cat-file -e "$REF^{commit}" 2>/dev/null; then
              git checkout -f "$REF"
              TARGET_DESC="sha:$REF"
            else
              # 4) Последний шанс — main
              git checkout -f -B main origin/main
              TARGET_DESC="origin/main (fallback)"
            fi

            echo "Deploying commit: $(git rev-parse --short HEAD) ($TARGET_DESC)"

            echo "== Python deps =="
            . "$VENV_ACT"
            python -m pip install --upgrade pip wheel
            pip install --no-cache-dir -r requirements.txt

            echo "== Export env from $ENV_PATH_FILE =="
            set -a
            . "$ENV_PATH_FILE"
            set +a

            export DJANGO_SETTINGS_MODULE=settings
            export DJANGO_ENV=${DJANGO_ENV:-prod}
            export READ_DOTENV=${READ_DOTENV:-False}
            export PYTHONPATH="$REPO_DIR:${PYTHONPATH:-}"

            echo "== Django checks & migrations =="
            python -m django check --deploy
            python -m django migrate --noinput
            python -m django collectstatic --noinput

            echo "== DSH sidecar (branding / image) =="
            DSH_ROOT="/opt/dsh"
            if [ -f "$DSH_ROOT/docker-compose.yml" ] && [ -f "$REPO_DIR/deploy/dsh/sync-sidecar.sh" ]; then
              sidecar_out="$(sudo bash "$REPO_DIR/deploy/dsh/sync-sidecar.sh" "$REPO_DIR" "$DSH_ROOT")"
              echo "$sidecar_out"
              if echo "$sidecar_out" | grep -q 'SIDECAR_CHANGED=1'; then
                echo "DSH sidecar files changed — rebuild and recreate"
                cd "$DSH_ROOT"
                sudo docker compose --env-file dsh.env up -d --build
                sudo ./dsh-healthcheck.sh
              else
                echo "DSH sidecar unchanged — leave running sessions alone"
              fi
            else
              echo "DSH sidecar is not installed at $DSH_ROOT — skip"
            fi

            echo "== Install checklist sort worker =="
            sudo install -m 0644 \
              "$REPO_DIR/deploy/checklist-sort-worker.service" \
              /etc/systemd/system/ai_app-checklist-sort-worker.service
            sudo systemctl daemon-reload
            sudo systemctl enable ai_app-checklist-sort-worker.service

            echo "== Restart Django services =="
            sudo systemctl restart ai_app
            sudo systemctl restart ai_app-checklist-sort-worker.service
            sudo systemctl is-active --quiet ai_app-checklist-sort-worker.service

            echo "== Healthcheck (gunicorn socket) =="
            ok=0
            for i in {1..40}; do
              if curl -sS --fail \
                --unix-socket "$APP_DIR/run/gunicorn.sock" \
                -H "Host: imcmontanai.ru" \
                -H "X-Forwarded-Proto: https" \
                http://unix/health/ >/dev/null; then
                ok=1; break
              fi
              sleep 0.5
            done

            if [ "$ok" -ne 1 ]; then
              echo "Gunicorn health failed — showing logs:"
              systemctl status --no-pager ai_app || true
              journalctl -u ai_app -n 200 --no-pager || true
              exit 1
            fi

            echo "== External HTTPS check =="
            curl --fail --silent --show-error https://imcmontanai.ru/health/ | grep -qx "OK"
            echo "Deploy OK"