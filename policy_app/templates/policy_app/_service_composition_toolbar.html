{% load static %}
<div class="proposal-service-text-toolbar" id="{{ toolbar_id|default:'typical-service-composition-toolbar' }}">
          <div class="proposal-service-text-toolbar__group">
            <select class="form-select form-select-sm proposal-service-text-toolbar__select" data-format="font" aria-label="Шрифт">
              <option value="calibri" selected>Calibri</option>
              <option value="cambria">Cambria</option>
              <option value="sans">Sans Serif</option>
              <option value="serif">Serif</option>
              <option value="monospace">Monospace</option>
              <option value="georgia">Georgia</option>
              <option value="times-new-roman">Times New Roman</option>
            </select>
          </div>
          <div class="proposal-service-text-toolbar__group">
            <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn" data-format="bold" aria-label="Жирный">
              <i class="bi bi-type-bold"></i>
            </button>
            <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn" data-format="italic" aria-label="Курсив">
              <i class="bi bi-type-italic"></i>
            </button>
            <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn" data-format="underline" aria-label="Подчеркнутый">
              <i class="bi bi-type-underline"></i>
            </button>
          </div>
          <div class="proposal-service-text-toolbar__group">
            <div class="proposal-service-text-toolbar__color-combo" data-color-combo="color">
              <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn proposal-service-text-toolbar__btn--combo" data-apply-color="color" aria-label="Применить цвет текста" title="Применить цвет текста">
                <i class="bi bi-palette"></i>
              </button>
              <button type="button" class="proposal-service-text-toolbar__color" data-color-toggle="color" title="Выбрать цвет текста" aria-label="Выбрать цвет текста" aria-expanded="false">
                <span class="proposal-service-text-toolbar__color-swatch" data-color-preview="color" style="background:#000000;"></span>
              </button>
              <div class="proposal-service-text-toolbar__color-popover" data-color-popover="color" hidden>
                <div class="proposal-service-text-toolbar__color-sv" data-color-sv="color">
                  <span class="proposal-service-text-toolbar__color-sv-handle" data-color-sv-handle="color"></span>
                </div>
                <div class="proposal-service-text-toolbar__color-hue" data-color-hue="color" role="slider" tabindex="0" aria-label="Оттенок цвета текста" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">
                  <span class="proposal-service-text-toolbar__color-hue-handle" data-color-hue-handle="color"></span>
                </div>
                <div class="proposal-service-text-toolbar__color-rgb">
                  <label><input type="number" min="0" max="255" value="0" data-color-rgb="color" data-color-channel="r"><span>R</span></label>
                  <label><input type="number" min="0" max="255" value="0" data-color-rgb="color" data-color-channel="g"><span>G</span></label>
                  <label><input type="number" min="0" max="255" value="0" data-color-rgb="color" data-color-channel="b"><span>B</span></label>
                </div>
                <div class="proposal-service-text-toolbar__color-actions">
                  <button type="button" class="btn btn-primary btn-sm flex-grow-1" data-color-commit="color">Применить</button>
                  <button type="button" class="btn btn-outline-secondary btn-sm proposal-service-text-toolbar__color-reset" data-color-reset="color" title="Сбросить цвет текста" aria-label="Сбросить цвет текста">
                    <i class="bi bi-arrow-counterclockwise"></i>
                  </button>
                </div>
              </div>
            </div>
            <div class="proposal-service-text-toolbar__color-combo" data-color-combo="background">
              <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn proposal-service-text-toolbar__btn--combo" data-apply-color="background" aria-label="Применить цвет фона" title="Применить цвет фона">
                <i class="bi bi-paint-bucket"></i>
              </button>
              <button type="button" class="proposal-service-text-toolbar__color" data-color-toggle="background" title="Выбрать цвет фона" aria-label="Выбрать цвет фона" aria-expanded="false">
                <span class="proposal-service-text-toolbar__color-swatch" data-color-preview="background" style="background:#ffffff;"></span>
              </button>
              <div class="proposal-service-text-toolbar__color-popover" data-color-popover="background" hidden>
                <div class="proposal-service-text-toolbar__color-sv" data-color-sv="background">
                  <span class="proposal-service-text-toolbar__color-sv-handle" data-color-sv-handle="background"></span>
                </div>
                <div class="proposal-service-text-toolbar__color-hue" data-color-hue="background" role="slider" tabindex="0" aria-label="Оттенок цвета фона" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">
                  <span class="proposal-service-text-toolbar__color-hue-handle" data-color-hue-handle="background"></span>
                </div>
                <div class="proposal-service-text-toolbar__color-rgb">
                  <label><input type="number" min="0" max="255" value="255" data-color-rgb="background" data-color-channel="r"><span>R</span></label>
                  <label><input type="number" min="0" max="255" value="255" data-color-rgb="background" data-color-channel="g"><span>G</span></label>
                  <label><input type="number" min="0" max="255" value="255" data-color-rgb="background" data-color-channel="b"><span>B</span></label>
                </div>
                <div class="proposal-service-text-toolbar__color-actions">
                  <button type="button" class="btn btn-primary btn-sm flex-grow-1" data-color-commit="background">Применить</button>
                  <button type="button" class="btn btn-outline-secondary btn-sm proposal-service-text-toolbar__color-reset" data-color-reset="background" title="Сбросить цвет фона" aria-label="Сбросить цвет фона">
                    <i class="bi bi-arrow-counterclockwise"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="proposal-service-text-toolbar__group">
            <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn" data-list="ordered" aria-label="Нумерованный список">
              <img src="{% static 'core/icons/list-number.svg' %}" alt="" class="proposal-service-text-toolbar__icon">
            </button>
            <div class="proposal-service-text-toolbar__list-split dropdown" data-list-marker-control>
              <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn proposal-service-text-toolbar__btn--list-primary" data-list="bullet" data-list-marker-primary aria-label="Маркированный список" title="Маркированный список">
                <img src="{% static 'core/icons/list-ul2.svg' %}" alt="" class="proposal-service-text-toolbar__icon" data-list-marker-icon>
              </button>
              <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn proposal-service-text-toolbar__btn--list-toggle dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" data-bs-display="static" data-bs-popper="static" aria-expanded="false" aria-label="Выбрать тип маркера"></button>
              <ul class="dropdown-menu proposal-service-text-toolbar__list-menu">
                <li><button type="button" class="dropdown-item" data-list="bullet" data-list-marker-option><span class="proposal-service-text-toolbar__marker-preview">•</span>Точка</button></li>
                <li><button type="button" class="dropdown-item" data-list="circle" data-list-marker-option><span class="proposal-service-text-toolbar__marker-preview proposal-service-text-toolbar__marker-preview--circle">o</span>Круг</button></li>
                <li><button type="button" class="dropdown-item" data-list="square" data-list-marker-option><span class="proposal-service-text-toolbar__marker-preview">▪</span>Квадрат</button></li>
                <li><button type="button" class="dropdown-item" data-list="dash" data-list-marker-option><span class="proposal-service-text-toolbar__marker-preview">-</span>Дефис</button></li>
                <li><button type="button" class="dropdown-item" data-list="ndash" data-list-marker-option><span class="proposal-service-text-toolbar__marker-preview">–</span>Тире</button></li>
                <li><button type="button" class="dropdown-item" data-list="check" data-list-marker-option><span class="proposal-service-text-toolbar__marker-preview">✓</span>Галочка</button></li>
              </ul>
            </div>
          </div>
          <div class="proposal-service-text-toolbar__group">
            <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn" data-align="justify" aria-label="По ширине">
              <img src="{% static 'core/icons/text-align-justify.svg' %}" alt="" class="proposal-service-text-toolbar__icon">
            </button>
            <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn" data-align="left" aria-label="По левому краю">
              <img src="{% static 'core/icons/text-align-left.svg' %}" alt="" class="proposal-service-text-toolbar__icon">
            </button>
            <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn" data-align="center" aria-label="По центру">
              <img src="{% static 'core/icons/text-align-center.svg' %}" alt="" class="proposal-service-text-toolbar__icon">
            </button>
            <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn" data-align="right" aria-label="По правому краю">
              <img src="{% static 'core/icons/text-align-right.svg' %}" alt="" class="proposal-service-text-toolbar__icon">
            </button>
          </div>
          <div class="proposal-service-text-toolbar__group">
            <button type="button" class="btn btn-light btn-sm proposal-service-text-toolbar__btn" data-action="clean" aria-label="Очистить форматирование">
              <i class="bi bi-eraser"></i>
            </button>
          </div>
        </div>
