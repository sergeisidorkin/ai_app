<div id="policy-pane"
     data-header-root-label="Продукты"
     data-header-root-url="{% url 'policy_partial' %}"
     data-header-current-label="Карта продуктов"
     data-header-current-url="{% url 'product_map' %}">
  <div class="card shadow-sm policy-group-card">
    <div class="card-body">
      {% if product_maps %}
        <div id="product-map-field" class="product-map-field" data-product-map-projects-url="{% url 'product_map_projects' %}"{% if request.user.is_authenticated and request.user.is_staff %} data-product-workspace-template="{% url 'product_workspace' 0 %}"{% endif %}>
          <div class="product-map-board">
            <div class="product-map-toolbar" role="toolbar" aria-label="Управление картой продуктов">
              <button type="button" class="btn btn-outline-primary btn-sm product-map-level" data-product-map-level="1" aria-pressed="false">1</button>
              <button type="button" class="btn btn-outline-primary btn-sm product-map-level" data-product-map-level="2" aria-pressed="false">2</button>
              <button type="button" class="btn btn-outline-primary btn-sm product-map-level" data-product-map-level="3" aria-pressed="false">3</button>
              <button type="button" class="btn btn-outline-primary btn-sm product-map-level" data-product-map-level="4" aria-pressed="false">4</button>
              <button type="button" class="btn btn-outline-primary btn-sm product-map-level is-active" data-product-map-level="5" aria-pressed="true">5</button>
              <div class="product-map-filters" role="group" aria-label="Фильтры карты продуктов">
                  <div class="dropdown" data-product-map-filter="consulting">
                    <button class="btn btn-outline-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-popper-config='{"strategy":"fixed"}' aria-expanded="false">
                      Вид консалтинга: <span data-product-map-filter-label>Все</span>
                    </button>
                    <div class="dropdown-menu p-3 project-filter-menu" style="max-height: 240px; overflow-y: auto;">
                      <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" value="__all__" id="product-map-consulting-filter-all" data-product-map-filter-all checked>
                        <label class="form-check-label" for="product-map-consulting-filter-all">Все виды</label>
                      </div>
                      <hr class="dropdown-divider">
                      <div data-product-map-filter-list></div>
                    </div>
                  </div>
                  <div class="dropdown" data-product-map-filter="category">
                    <button class="btn btn-outline-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-popper-config='{"strategy":"fixed"}' aria-expanded="false">
                      Тип услуги: <span data-product-map-filter-label>Все</span>
                    </button>
                    <div class="dropdown-menu p-3 project-filter-menu" style="max-height: 240px; overflow-y: auto;">
                      <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" value="__all__" id="product-map-category-filter-all" data-product-map-filter-all checked>
                        <label class="form-check-label" for="product-map-category-filter-all">Все типы</label>
                      </div>
                      <hr class="dropdown-divider">
                      <div data-product-map-filter-list></div>
                    </div>
                  </div>
                  <div class="dropdown" data-product-map-filter="subtype">
                    <button class="btn btn-outline-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-popper-config='{"strategy":"fixed"}' aria-expanded="false">
                      Подтип услуги: <span data-product-map-filter-label>Все</span>
                    </button>
                    <div class="dropdown-menu p-3 project-filter-menu" style="max-height: 240px; overflow-y: auto;">
                      <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" value="__all__" id="product-map-subtype-filter-all" data-product-map-filter-all checked>
                        <label class="form-check-label" for="product-map-subtype-filter-all">Все подтипы</label>
                      </div>
                      <hr class="dropdown-divider">
                      <div data-product-map-filter-list></div>
                    </div>
                  </div>
                  <button type="button" class="product-map-toggle is-active" data-product-map-projects-toggle aria-pressed="true" title="Показать/скрыть проекты">
                    <i class="bi bi-eye" aria-hidden="true"></i>
                    <span>Показать проекты</span>
                  </button>
                  <button type="button" class="product-map-toggle is-active" data-product-map-collapse-empty aria-pressed="true" title="Свернуть/развернуть ветки без проектов за выбранный период">
                    <i class="bi bi-plus-circle" aria-hidden="true"></i>
                    <span data-product-map-collapse-empty-label>Развернуть пустые</span>
                  </button>
                  <div class="dropdown" data-product-map-period>
                    <button class="btn btn-outline-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-popper-config='{"strategy":"fixed"}' aria-expanded="false">
                      Период: <span data-product-map-period-label>Все</span>
                    </button>
                    <div class="dropdown-menu p-3 project-filter-menu" style="max-height: 240px; overflow-y: auto;">
                      <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" value="__all__" id="product-map-period-filter-all" data-product-map-filter-all checked>
                        <label class="form-check-label" for="product-map-period-filter-all">Все годы</label>
                      </div>
                      <hr class="dropdown-divider">
                      {% for year in product_map_years %}
                        <div class="form-check">
                          <input class="form-check-input" type="checkbox" value="{{ year }}" id="product-map-period-filter-{{ year }}" data-product-map-filter-value>
                          <label class="form-check-label" for="product-map-period-filter-{{ year }}">{{ year }}</label>
                        </div>
                      {% endfor %}
                    </div>
                  </div>
                </div>
                <div class="product-map-zoom" role="group" aria-label="Масштаб">
                  <span class="product-map-zoom-value" data-product-map-zoom-value>100%</span>
                  <button type="button" class="btn btn-outline-primary btn-sm product-map-level product-map-zoom-btn" data-product-map-zoom="out" title="Уменьшить" aria-label="Уменьшить"></button>
                  <button type="button" class="btn btn-outline-primary btn-sm product-map-level product-map-zoom-btn" data-product-map-zoom="in" title="Увеличить" aria-label="Увеличить"></button>
                  <button type="button" class="btn btn-outline-primary btn-sm product-map-level product-map-fullscreen-btn" data-product-map-fullscreen="1" aria-pressed="false" title="Развернуть диаграмму на весь экран" aria-label="Развернуть диаграмму на весь экран">
                    <i class="bi bi-arrows-fullscreen" aria-hidden="true"></i>
                  </button>
                </div>
            </div>
            <div class="product-map-stage">
              <aside class="product-map-stats is-collapsed" data-product-map-stats>
                <div class="product-map-stats-bar">
                  <span class="product-map-stats-info"
                        role="img"
                        aria-label="Количество продуктов в ветке"
                        title="Количество продуктов в ветке">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                  </span>
                  <button type="button"
                          class="product-map-stats-toggle is-plus"
                          data-product-map-stats-toggle
                          aria-expanded="false"
                          aria-label="Развернуть статистику"></button>
                </div>
                <div class="product-map-stats-body" data-product-map-stats-body>
                  <table class="product-map-stats-table">
                    <thead>
                      <tr>
                        <th scope="col" class="product-map-stats-label">
                          <button type="button"
                                  class="product-map-stats-branch"
                                  data-product-map-stats-branches
                                  aria-expanded="false"
                                  aria-label="Развернуть строки"><i class="bi bi-caret-down-fill" aria-hidden="true"></i></button><span>Вид консалтинга</span>
                          <span class="product-map-stats-levels" role="group" aria-label="Уровни статистики">
                            <button type="button" class="btn btn-outline-primary product-map-level product-map-stats-level is-active" data-product-map-stats-level="1" aria-pressed="true">1</button>
                            <button type="button" class="btn btn-outline-primary product-map-level product-map-stats-level" data-product-map-stats-level="2" aria-pressed="false">2</button>
                            <button type="button" class="btn btn-outline-primary product-map-level product-map-stats-level" data-product-map-stats-level="3" aria-pressed="false">3</button>
                            <button type="button" class="btn btn-outline-primary product-map-level product-map-stats-level" data-product-map-stats-level="4" aria-pressed="false">4</button>
                          </span>
                        </th>
                        <th scope="col" class="product-map-stats-label">Тип услуги</th>
                        <th scope="col" class="product-map-stats-label">Подтип услуг</th>
                        <th scope="col" class="product-map-stats-label">Продукт</th>
                        <th scope="col" class="product-map-stats-count">Продукты</th>
                        <th scope="col" class="product-map-stats-hist">
                          <span class="product-map-stats-hist-modes" role="group" aria-label="Диаграмма">
                            <button type="button"
                                    class="product-map-toggle product-map-stats-hist-mode is-active"
                                    data-product-map-stats-hist="products"
                                    aria-pressed="true"
                                    title="Число продуктов"
                                    aria-label="Число продуктов">
                              <i class="bi bi-eye" aria-hidden="true"></i>
                              <span class="product-map-stats-hist-swatch is-products" aria-hidden="true"></span>
                            </button>
                            <button type="button"
                                    class="product-map-toggle product-map-stats-hist-mode"
                                    data-product-map-stats-hist="usage"
                                    aria-pressed="false"
                                    title="Число использований"
                                    aria-label="Число использований">
                              <i class="bi bi-eye-slash" aria-hidden="true"></i>
                              <span class="product-map-stats-hist-swatch is-usage" aria-hidden="true"></span>
                            </button>
                          </span>
                        </th>
                      </tr>
                    </thead>
                    <tbody data-product-map-stats-rows></tbody>
                  </table>
                </div>
              </aside>
              {% for item in product_maps %}
                <div class="product-map-canvas" id="product-map-canvas-{{ forloop.counter }}"></div>
              {% endfor %}
            </div>
          </div>
        </div>
      {% else %}
        <p class="text-muted mb-0">Пока нет данных.</p>
      {% endif %}
    </div>
  </div>
  {{ product_maps|json_script:"product-map-data" }}
  <div class="modal fade" id="product-map-projects-modal" tabindex="-1" aria-hidden="true" aria-labelledby="product-map-projects-title">
    <div class="modal-dialog modal-xl modal-dialog-scrollable product-map-projects-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="product-map-projects-title">
            <span class="product-map-projects-total" data-product-map-projects-count hidden></span>
            <span data-product-map-projects-title>Проекты</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body" data-product-map-projects-body></div>
      </div>
    </div>
  </div>
</div>
